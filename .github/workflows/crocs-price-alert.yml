name: Crocs Price Alert

on:
  schedule:
    # Every hour at minute 17.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crocs-price-monitor
  cancel-in-progress: true

jobs:
  check-prices:
    runs-on: ubuntu-latest

    env:
      PRICE_LIMIT: "2000"
      SEARCH_TERM: "Crocs"
      MAX_PRODUCTS_PER_SITE: "40"
      STATE_FILE: "data/prices.json"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check Crocs prices
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python price_tracker.py

      - name: Commit price history
        run: |
          if git diff --quiet -- data/prices.json; then
            echo "No price-history changes."
            exit 0
          fi
          git config user.name "crocs-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "Update Crocs price history"
          git push
